plugins { id 'com.android.application' }
android {
 namespace 'com.salvatorecodes.inkoku'
 compileSdk 36
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 defaultConfig {
  applicationId 'com.salvatorecodes.inkoku'
  minSdk 26
  targetSdk 36
  versionCode 3
  versionName '2.0.0'
 }
 signingConfigs {
  release {
   if (System.getenv('INKOKU_KEYSTORE')) {
    storeFile file(System.getenv('INKOKU_KEYSTORE'))
    storePassword System.getenv('INKOKU_STORE_PASSWORD')
    keyAlias 'inkoku'
    keyPassword System.getenv('INKOKU_STORE_PASSWORD')
   }
  }
 }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
